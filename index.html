<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rehabilitación">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <title>Rehabilitación · Hombro</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="lock" class="lock-screen">
    <div class="lock-inner">
      <div class="lock-mark">R</div>
      <div class="eyebrow">Acceso personal</div>
      <h1>Rehabilitación</h1>
      <p class="lock-copy">Ingresá tu PIN para continuar.</p>
      <form id="pin-form" class="pin-form" autocomplete="off">
        <input id="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••" aria-label="PIN">
        <button type="submit">Entrar</button>
      </form>
      <p id="pin-error" class="pin-error" aria-live="polite"></p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="site-header">
      <button class="brand" data-action="home" aria-label="Inicio">
        <span class="brand-mark">R</span>
        <span>Rehabilitación</span>
      </button>
      <div class="header-actions">
        <button class="icon-button" id="refresh-button" aria-label="Forzar actualización" title="Forzar actualización">↻</button>
        <button class="ghost-button" id="lock-button" aria-label="Bloquear">Bloquear</button>
      </div>
    </header>

    <main id="view"></main>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
